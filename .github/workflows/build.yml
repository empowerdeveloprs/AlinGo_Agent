name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Debug — Check files
        run: |
          echo "=== Gradle files ==="
          ls -la gradlew || echo "No gradlew"
          ls -la gradle/wrapper/ || echo "No wrapper"
          echo "=== App structure ==="
          ls -la app/ || echo "No app dir"
          echo "=== Build.gradle ==="
          head -20 build.gradle
      
      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --info
          else
            echo "❌ No gradlew found — trying gradle wrapper"
            gradle wrapper --gradle-version 8.2
            ./gradlew assembleDebug --stacktrace --info
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlinGo-Agent-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
