name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK (manual)
        run: |
          # Android SDK is pre-installed on ubuntu-latest
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || echo "SDK not found"
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install platform-tools + platform 34
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2
      
      - name: Debug Info
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== Gradlew ==="
          ls -la gradlew || echo "No gradlew"
          echo "=== Gradle version ==="
          gradle --version
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME
      
      - name: Generate gradlew if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi
      
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlinGo-Agent-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
