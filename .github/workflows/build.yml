name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2
      
      - name: Debug Info
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== Gradlew ==="
          ls -la gradlew || echo "No gradlew"
          echo "=== Gradle wrapper dir ==="
          ls -la gradle/wrapper/ || echo "No wrapper"
          echo "=== Gradle version ==="
          gradle --version
      
      - name: Generate gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi
      
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlinGo-Agent-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
