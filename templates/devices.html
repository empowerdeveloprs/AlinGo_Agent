{% extends "base.html" %}
{% block title %}Devices · Zentrix{% endblock %}
{% block head %}
<style>
section{background:white;border:1px solid #e1e7f0;border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:1.15rem;margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,button{font:inherit;padding:10px;border:1px solid #ccd5e3;border-radius:8px}
button{cursor:pointer;background:#174a86;color:white;border:0}
button.secondary{background:#52627a}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid #e7ecf3;overflow-wrap:anywhere}
.wrap{overflow-x:auto}
.online{color:#087a43}.offline{color:#b42318}
.note{color:#52627a;font-size:.9rem}
#message{margin:12px 0}
#tokenBox{display:none;background:#fff7db;padding:12px;border-radius:8px}
</style>
{% endblock %}
{% block content %}
<div id="message" role="status"></div>

<section>
<h2>Register a device</h2>
<form id="deviceForm" class="row">
<input name="device_uid" placeholder="Unique device ID" required maxlength="160">
<input name="label" placeholder="Device label" maxlength="160">
<button type="submit">Register device</button>
</form>
<p class="note">The credential is shown only once.</p>
<div id="tokenBox">
<strong>Device credential — shown once</strong>
<p id="tokenText"></p>
<button type="button" id="copyToken">Copy</button>
<button type="button" class="secondary" id="hideToken">Hide</button>
</div>
</section>

<section>
<div class="row" style="justify-content:space-between">
<h2>All Devices</h2>
<button id="refresh" class="secondary">Refresh</button>
</div>
<div class="wrap">
<table>
<thead><tr><th>Device ID</th><th>Label</th><th>Status</th><th>Last seen</th><th>Connection</th></tr></thead>
<tbody id="devices"><tr><td colspan="5">Loading…</td></tr></tbody>
</table>
</div>
</section>

<script>
const $ = id => document.getElementById(id);
function message(t){ $('message').textContent = t || ''; }
async function api(path, options={}) {
  const r = await fetch(path, {credentials:'same-origin', headers:{'Content-Type':'application/json', ...(options.headers||{})}, ...options});
  const t = r.headers.get('content-type') || '';
  const d = t.includes('application/json') ? await r.json() : null;
  if (r.redirected && r.url.includes('/auth/login')) { location.href='/auth/login'; throw new Error('login'); }
  if (!r.ok) throw new Error((d && (d.error || d.message)) || ('HTTP ' + r.status));
  return d;
}
function cell(tr, v, cls=''){const td=document.createElement('td');td.textContent=v??'—';if(cls)td.className=cls;tr.appendChild(td);return td;}
async function loadDevices(){
  const data = await api('/devices');
  const body = $('devices'); body.replaceChildren();
  if(!data.length){const tr=document.createElement('tr');cell(tr,'No devices registered.');body.appendChild(tr);return;}
  for(const d of data){
    const tr = document.createElement('tr');
    cell(tr, d.device_uid); cell(tr, d.label);
    cell(tr, d.connection_status, d.connection_status==='online'?'online':'offline');
    cell(tr, d.last_seen);
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.textContent = d.enabled ? 'Disconnect' : 'Reconnect';
    btn.className = d.enabled ? 'secondary' : '';
    btn.addEventListener('click', async()=>{
      btn.disabled = true;
      try{
        await api('/admin/devices/'+encodeURIComponent(d.device_uid)+'/connection',{method:'POST',body:JSON.stringify({enabled:!Boolean(d.enabled)})});
        message('Updated '+d.device_uid); await loadDevices();
      }catch(e){message(e.message);}finally{btn.disabled=false;}
    });
    td.appendChild(btn); tr.appendChild(td); body.appendChild(tr);
  }
}
$('deviceForm').addEventListener('submit', async e=>{
  e.preventDefault(); message('');
  const form = new FormData(e.target);
  try{
    const data = await api('/devices',{method:'POST',body:JSON.stringify({device_uid:String(form.get('device_uid')||'').trim(),label:String(form.get('label')||'').trim()})});
    $('tokenText').textContent = data.token_once;
    $('tokenBox').style.display='block';
    e.target.reset();
    message('Device registered. Save credential now.');
    await loadDevices();
  }catch(err){message('Failed: '+err.message);}
});
$('copyToken').addEventListener('click', async()=>{
  try{await navigator.clipboard.writeText($('tokenText').textContent);message('Copied');}
  catch(e){message('Copy failed');}
});
$('hideToken').addEventListener('click',()=>{$('tokenBox').style.display='none';});
$('refresh').addEventListener('click', loadDevices);
loadDevices();
</script>
{% endblock %}
