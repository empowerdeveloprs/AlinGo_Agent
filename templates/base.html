<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Zentrix{% endblock %}</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
nav{background:#132b50;padding:0 18px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
nav .brand{color:white;font-weight:700;padding:14px 12px;font-size:1.1rem}
nav a{color:#d5e4fa;text-decoration:none;padding:14px 12px;font-size:.95rem;border-bottom:3px solid transparent}
nav a:hover{color:white;background:#1d3a66}
nav a.active{color:white;border-bottom-color:#5b9cf5}
nav .spacer{flex:1}
main{max-width:1100px;margin:auto;padding:18px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <span class="brand">Zentrix</span>
  <a href="/" class="{% if request.endpoint == 'dashboard.dashboard' %}active{% endif %}">Dashboard</a>
  <a href="/devices/page" class="{% if request.endpoint == 'devices.page' %}active{% endif %}">Devices</a>
  <a href="/admin/file-audit/page" class="{% if request.endpoint == 'file_audit.page' %}active{% endif %}">File Audit</a>
  <a href="/admin/screen-viewer/page" class="{% if request.endpoint == 'screen_viewer.page' %}active{% endif %}">Screen Viewer</a>
  <a href="/api/v1/page" class="{% if request.endpoint == 'surveys.page' %}active{% endif %}">Surveys</a>
  <a href="/candidate/page" class="{% if request.endpoint == 'candidate_links.page' %}active{% endif %}">Candidate Links</a>
  <span class="spacer"></span>
  <a href="/auth/logout">Logout</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
